    .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes spin{to{transform:rotate(360deg)}} @keyframes tw{50%{transform:scale(1.35) rotate(18deg)}}
    @keyframes pulse{50%{transform:scale(1.04)}} @keyframes blink{50%{opacity:0}}
    @media (prefers-color-scheme: dark){
