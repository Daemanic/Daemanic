      .ink{fill:#fff} .sh{fill:#3a45ff} .lab{fill:#7DB4F2} .pill{fill:#7DB4F2} .pilltxt{fill:#0b1236}
      .star{fill:#7DB4F2} .disc{fill:#fff;stroke:#0b1236} .frame{stroke:#7DB4F2}
    }
    @media (prefers-reduced-motion: reduce){ .spin,.tw,.pulse,.blink{animation:none} }
  </style>
