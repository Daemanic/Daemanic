<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Daemanic &#183; Cybersecurity</title>
  <desc id="d">Hero banner with an animated shield and padlock motif</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="s1"/>
      <stop offset="1" class="s2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7DB4F2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7DB4F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DB4F2" stop-opacity="0"/>
      <stop offset="1" stop-color="#7DB4F2" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="shield">
      <path d="M960 65 L1035 92 V165 C1035 210 1000 238 960 255 C920 238 885 210 885 165 V92 Z"/>
    </clipPath>
  </defs>
  <style>
    .s1{stop-color:#0d1117} .s2{stop-color:#111a26}
    .ink{fill:#f0f6fc} .sub{fill:#9fb0c6} .tag{fill:#7DB4F2}
    .frame{stroke:#1f3350} .dot{fill:#7DB4F2;opacity:.22}
    .ring{stroke:#7DB4F2;fill:none;opacity:.35}
    .shield{stroke:#7DB4F2;fill:rgba(125,180,242,.07)}
    .lock{fill:#7DB4F2} .hole{fill:#0d1117}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
    .spinr{transform-box:fill-box;transform-origin:center;animation:spin 55s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sweep{animation:sweep 3.6s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateY(-70px)}100%{transform:translateY(190px)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-color-scheme: light){
      .s1{stop-color:#f6f8fa} .s2{stop-color:#e6eefb}
      .ink{fill:#1f2328} .sub{fill:#57606a} .tag{fill:#2a62b0}
      .frame{stroke:#bcd3f0} .dot{opacity:.35}
      .ring{opacity:.5} .shield{fill:rgba(125,180,242,.12)}
      .hole{fill:#f6f8fa}
    }
    @media (prefers-reduced-motion: reduce){ .spin,.spinr,.sweep,.blink{animation:none} }
  </style>

  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#bg)" class="frame" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#glow)"/>

  <!-- text -->
  <text x="70" y="108" class="mono tag" font-size="18" letter-spacing="2">$ WHOAMI</text>
  <text x="66" y="188" class="sans ink" font-size="88" font-weight="800" letter-spacing="-2">Aditya Shrestha</text>
  <rect x="70" y="208" width="84" height="5" rx="2.5" fill="#7DB4F2"/>
  <text x="70" y="252" class="mono tag" font-size="18" letter-spacing="4">BUILD  &#183;  TEST  &#183;  BREAK  &#183;  UNDERSTAND<tspan class="blink">_</tspan></text>

